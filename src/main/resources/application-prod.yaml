spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update

  docker:
    compose:
      enabled: false
  mail:
    sender: ${MAIL_SENDER}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

logging:
  level:
    org.springframework.security: DEBUG

server:
  port: ${APP_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800}
  access-token:
    expiration: ${JWT_ACCESS_EXPIRATION:900}

app:
  client:
    base-url: ${APP_CLIENT_BASE_URL}
