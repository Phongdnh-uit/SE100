services:
  server-se110:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: server-se100
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      mysql:
          condition: service_healthy

  mysql:
    image: mysql:latest
    container_name: mysql-se100
    environment:
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: verysecret
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      retries: 5
      timeout: 5s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
